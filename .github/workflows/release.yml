name: Release

# A pushed `v*` tag builds every platform from a clean checkout, as an archive and as a package
# (AppImage, .dmg, Windows installer), then waits in the `release` environment for a reviewer
# before anything is published. The published release carries SHA256SUMS and a
# build-provenance attestation for every file:
#   gh attestation verify <archive> --repo anicke/kerf
# Running the workflow by hand (workflow_dispatch) builds and uploads the archives as workflow
# artifacts only: a dry run that never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Fail before any build if the tag and the workspace version disagree.
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      label: ${{ steps.check.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version comes from rust-toolchain.toml.
      - run: rustup toolchain install --profile minimal
      - name: Check
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kerf") | .version')
          echo "workspace version $version"
          if [ "$REF_TYPE" != "tag" ]; then
            echo "not a tag: dry run, nothing will be published"
            label="dev-${SHA::7}"
          elif [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          else
            label="$TAG"
          fi
          # Names every file: kerf-<label>-<target>.tar.gz, kerf-<label>-linux-x86_64.AppImage…
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu runner, so the binaries need only an older glibc and
          # run on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    # No rust-cache here on purpose: a tag build can restore caches saved by main, and a
    # release should come from nothing but the tagged source and Cargo.lock.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install --profile minimal
          rustup target add "$TARGET"
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p kerf -p kerf-cli -p kerf-mcp
      - name: Archive
        shell: bash
        env:
          LABEL: ${{ needs.version.outputs.label }}
          TARGET: ${{ matrix.target }}
        run: |
          name="kerf-$LABEL-$TARGET"
          mkdir -p "dist/$name"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          for bin in kerf kerf-cli kerf-mcp; do
            cp "target/$TARGET/release/$bin$ext" "dist/$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      # appimagetool and the runtime it embeds, pinned by release and checksum.
      - name: AppImage
        if: runner.os == 'Linux'
        env:
          LABEL: ${{ needs.version.outputs.label }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          TOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          TOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/appimagetool" "$TOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime" "$RUNTIME_URL"
          printf '%s  %s\n' "$TOOL_SHA256" "$tools/appimagetool" "$RUNTIME_SHA256" "$tools/runtime" \
            | sha256sum --check
          chmod +x "$tools/appimagetool"
          APPIMAGETOOL="$tools/appimagetool" APPIMAGE_RUNTIME="$tools/runtime" \
            packaging/linux/build-appimage.sh "target/$TARGET/release" \
            "dist/kerf-$LABEL-$PLATFORM.AppImage"
          # Smoke test: the launcher reaches the bundled tools, and the agent guide names the
          # AppImage as the way to run kerf-cli.
          image="dist/kerf-$LABEL-$PLATFORM.AppImage"
          "$image" --appimage-extract-and-run kerf-cli --version
          "$image" --appimage-extract-and-run kerf-cli skill print | grep -F "AppImage kerf-cli"
      - name: Disk image
        if: runner.os == 'macOS'
        env:
          LABEL: ${{ needs.version.outputs.label }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          packaging/macos/build-dmg.sh "target/$TARGET/release" "$VERSION" \
            "dist/kerf-$LABEL-$PLATFORM.dmg"
      # Inno Setup comes with the Windows runner image.
      - name: Installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          LABEL: ${{ needs.version.outputs.label }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q \
            "-DAppVersion=$VERSION" "-DBinDir=$(cygpath -w "$PWD/target/$TARGET/release")" \
            "-DOutputDir=$(cygpath -w "$PWD/dist")" "-DOutputName=kerf-$LABEL-$PLATFORM-setup" \
            packaging/windows/kerf.iss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          # The release keeps its own copy; these only need to outlast the publish approval.
          retention-days: 3

  publish:
    needs: build
    # Only a tag publishes; a manual run stops after the builds.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers on this environment are the gate: nothing below runs until approved.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Draft first, then publish: with immutable releases on, a release's assets are fixed
      # at the moment it is published, so everything must be uploaded before then.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --draft --verify-tag --title "Kerf $TAG" --generate-notes
          gh release edit "$TAG" --draft=false
