[workspace]
resolver = "2"
members = ["crates/kerf-core", "crates/kerf-app", "crates/kerf-cli", "crates/kerf-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Not published to crates.io: Kerf ships as an app.
publish = false
rust-version = "1.95"

[profile.dev]
# Audio code is unusable unoptimized; keep debug builds snappy.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
