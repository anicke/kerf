[package]
name = "kerf"
description = "Kerf - a fast, precise, cross-platform audio editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "kerf"
path = "src/main.rs"

[dependencies]
kerf-core = { path = "../kerf-core" }
kerf-mcp = { path = "../kerf-mcp" }
eframe = "0.37"
cpal = "0.18"
rfd = "0.18"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[dev-dependencies]
tempfile = "3"
