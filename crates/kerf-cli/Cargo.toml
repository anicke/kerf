[package]
name = "kerf-cli"
description = "Command-line tool for the Kerf audio editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "kerf-cli"
path = "src/main.rs"

[dependencies]
kerf-core = { path = "../kerf-core", features = ["schema"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "7"

[dev-dependencies]
tempfile = "3"
hound = "3.5"
