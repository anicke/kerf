[package]
name = "kerf-core"
description = "Editing engine for the Kerf audio editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
hound = "3.5"
rubato = "5"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
bytemuck = "1"
dirs = "7"

[dev-dependencies]
tempfile = "3"
