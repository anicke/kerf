[package]
name = "kerf-core"
description = "Editing engine for the Kerf audio editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
hound = "3.5"
rubato = "5"
realfft = "3"
flacenc = "0.5"
metaflac = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
bytemuck = "1"
dirs = "7"
png = "0.18"
base64 = "0.22"
schemars = { version = "1", optional = true }

[features]
# JSON Schemas for the operation requests (used by the MCP server).
schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "3"
