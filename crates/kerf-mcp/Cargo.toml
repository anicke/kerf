[package]
name = "kerf-mcp"
description = "MCP server for the Kerf audio editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "kerf-mcp"
path = "src/main.rs"

[dependencies]
kerf-core = { path = "../kerf-core", features = ["schema"] }
rmcp = { version = "3.11", features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "net", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
dirs = "7"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client", "transport-child-process"] }
tempfile = "3"
